[workspace]
members = ["figures-parser", "figures-parser-napi"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"

# Every warning is an error, so a lint listed at `warn` fails the build too.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Restriction lints, chosen one by one.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_docs_in_private_items = "deny"
as_conversions = "deny"
string_slice = "deny"
shadow_unrelated = "deny"
mem_forget = "deny"
rc_buffer = "deny"
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
unicode-general-category = "1.1"
unicode-script = "0.5"
iso_currency = "0.7"
linkify = "0.11"
rustc-hash = "2"
stats_alloc = "0.1"
criterion = { version = "0.8", default-features = false }
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
