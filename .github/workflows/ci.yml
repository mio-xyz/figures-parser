name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job installs the toolchain rust-toolchain.toml pins, so local and CI
# lint with the same clippy.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The workspace manifest denies every warning, and clippy's pedantic
      # and nursery groups with it.
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
          # The binding's test harness links Node-API symbols only a running
          # Node provides, which macOS and Windows linkers refuse; the library
          # stands alone.
          - os: macos-latest
            packages: -p figures-parser
          - os: windows-latest
            packages: -p figures-parser
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.packages }} --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked
      - run: cargo doc --workspace --no-deps --document-private-items --locked

  panic-freedom:
    name: Panic freedom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Every code point beside a figure, a link and a dated weekday, and
      # 200,000 generated inputs through every entry point, in a release
      # build that panics on overflow and runs debug assertions.
      - run: cargo test --profile panic-check -p figures-parser --test it --locked -- --ignored

  node:
    name: Node ${{ matrix.node }} binding
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The build writes the loader and its types; the committed ones are what
      # the package ships.
      - run: git diff --exit-code index.js index.d.ts
      - run: node smoke.mjs
